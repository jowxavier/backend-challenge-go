services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only}
      POSTGRES_DB: ${POSTGRES_DB:-wager}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-wager}:${POSTGRES_PASSWORD:-local_only}@postgres:5432/${POSTGRES_DB:-wager}?sslmode=disable"]
    command: ["up"]
volumes:
  postgres_data:
